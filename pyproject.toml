[project]
name = "jaide"
version = "0.0.5"
description = "custom cpu architecture"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "colorama==0.4.6",
    "lark==1.3.1",
    "pygame==2.6.1",
    "typed-argument-parser==1.12.0",
]

[dependency-groups]
dev = [
    "poethepoet",
    "pytest",
    "ruff==0.15.8",
]

[tool.poe.tasks]
all = { sequence = ["build", "run"], help = "Build and run the emulator" }
build = { cmd = "python -m jasm -v 0 kernel/boot.jasm -o bin/boot.bin --nolink --nowarn", help = "Build the boot image" }
run = { cmd = "python -m emulator bin/boot.bin --pit --rtc --graphics --disk --image jfs/images/disk.img -r -v 1", help = "Run the emulator" }
test = { cmd = "pytest", help = "Run the test suite" }
stats = { cmd = "cloc --include-ext=jasm,py,md,txt,ebnf --exclude-dir=.venv --read-lang-def=docs/lang/jasm_def.txt .", help = "Show project statistics" }

[tool.poe.tasks.clean]
help = "Remove build output"
script = "poethepoet.scripts:rm('bin')"

[tool.pytest]
testpaths = ["test"]

[tool.ruff]
fix = true
line-length = 320

[tool.ruff.lint]
select = ["I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# pythonVersion = "3.12"
# typeCheckingMode = "basic"
